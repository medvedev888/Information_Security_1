name: Build and security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: secure_notes_test
          POSTGRES_USER: notes_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U notes_test -d secure_notes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5433/secure_notes_test
      TEST_DB_USERNAME: notes_test
      TEST_DB_PASSWORD: ci-only-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests and SpotBugs with Find Security Bugs
        run: mvn -B verify
      - name: Upload test and SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-sast
          path: |
            target/surefire-reports/
            target/spotbugs*
            target/reports/spotbugs.html
          retention-days: 14
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-13-${{ runner.os }}-
      - name: Check NVD credential
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo 'Add NVD_API_KEY in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Psca -DskipTests verify
      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: target/dependency-check-report.*
          retention-days: 14
